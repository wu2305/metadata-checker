[package]
name = "metadata-checker"
version = "0.1.0"
edition = "2024"

[features]
default = ["cli-local"]
cli-local = [
    "dep:clap",
    "dep:redb",
    "dep:reqwest",
    "reqwest/blocking",
    "reqwest/rustls-tls",
    "reqwest/cookies",
    "reqwest/json",
    "dep:tokio",
    "dep:lz-str",
]
browser-wasm = [
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:js-sys",
    "dep:web-sys",
    "dep:reqwest",
]

[[bin]]
name = "metadata-checker"
path = "src/main.rs"
required-features = ["cli-local"]

[lib]
name = "metadata_checker"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
regex = "1"
petgraph = "0.8.3"
twox-hash = { version = "2", default-features = false, features = ["xxhash64"] }

# cli-local only
clap = { version = "4", features = ["derive", "help"], optional = true }
redb = { version = "4.1.0", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "cookies", "json"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread"], optional = true }
urlencoding = "2"
base64 = "0.22"
lz-str = { version = "0.2.1", optional = true }

# browser-wasm only
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
js-sys = { version = "0.3", optional = true }
web-sys = { version = "0.3", optional = true, features = [
    "RequestCredentials",
    "RequestInit",
    "Response",
    "Window",
] }

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
codegen-units = 1

[profile.release-fast]
inherits = "release"
opt-level = 3

[dev-dependencies]
nix = { version = "0.29", features = ["fs"] }
