[package]
name = "metadata-checker"
version = "0.1.0"
edition = "2024"

[features]
default = ["cli-local"]
cli-local = ["dep:clap", "dep:redb"]
browser-wasm = ["dep:wasm-bindgen", "dep:js-sys", "dep:web-sys", "dep:getrandom"]

[[bin]]
name = "metadata-checker"
path = "src/main.rs"
required-features = ["cli-local"]

[lib]
name = "metadata_checker"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
regex = "1"
petgraph = "0.8.3"
twox-hash = "2"

# cli-local only
clap = { version = "4", features = ["derive", "help"], optional = true }
redb = { version = "4.1.0", optional = true }

# browser-wasm only
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }
web-sys = { version = "0.3", optional = true }
getrandom = { version = "0.3", features = ["wasm_js"], optional = true }

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
codegen-units = 1

[profile.release-fast]
inherits = "release"
opt-level = 3

[dev-dependencies]
nix = { version = "0.29", features = ["fs"] }
