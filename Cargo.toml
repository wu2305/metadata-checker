[package]
name = "metadata-checker"
version = "0.1.0"
edition = "2024"

[features]
default = ["cli-local"]
cli-local = [
    "dep:clap",
    "dep:redb",
    "dep:reqwest",
    "reqwest/blocking",
    "reqwest/rustls-tls",
    "reqwest/cookies",
    "reqwest/json",
    "reqwest/gzip",
    "dep:base64",
    "dep:urlencoding",
    "dep:tokio",
    "dep:lz-str",
]
telemetry = [
    "dep:tracing",
    "dep:tracing-subscriber",
]
telemetry-otlp = [
    "telemetry",
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:tracing-opentelemetry",
    "dep:tokio",
]
browser-wasm = [
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:js-sys",
    "dep:web-sys",
    "dep:reqwest",
]

[[bin]]
name = "metadata-checker"
path = "src/main.rs"
required-features = ["cli-local"]

[[bin]]
name = "generate_browser_offscreen_fixtures"
path = "src/bin/generate_browser_offscreen_fixtures.rs"
required-features = ["cli-local"]

[[bin]]
name = "m51_profile_report"
path = "src/bin/m51_profile_report.rs"
required-features = ["cli-local"]

[[bin]]
name = "m51_core_profile_report"
path = "src/bin/m51_core_profile_report.rs"
required-features = ["cli-local"]

[lib]
name = "metadata_checker"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
regex = "1"
petgraph = "0.8.3"
twox-hash = { version = "2", default-features = false, features = ["xxhash64"] }

# cli-local only
clap = { version = "4", features = ["derive", "help"], optional = true }
redb = { version = "4.1.0", optional = true }
reqwest = { version = "0.12", default-features = false, optional = true }
tokio = { version = "1", features = ["rt-multi-thread"], optional = true }
urlencoding = { version = "2", optional = true }
base64 = { version = "0.22", optional = true }
lz-str = { version = "0.2.1", optional = true }

# telemetry only
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["fmt", "json"], optional = true }
opentelemetry = { version = "0.32", optional = true }
opentelemetry_sdk = { version = "0.32", features = ["metrics"], optional = true }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["trace", "metrics", "http-proto", "reqwest-blocking-client"], optional = true }
tracing-opentelemetry = { version = "0.33", optional = true }

# browser-wasm only
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
js-sys = { version = "0.3", optional = true }
web-sys = { version = "0.3", optional = true, features = [
    "RequestCredentials",
    "RequestInit",
    "Response",
    "Window",
] }

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
codegen-units = 1

[profile.release-fast]
inherits = "release"
opt-level = 3

[profile.bench]
inherits = "release-fast"

[dev-dependencies]
criterion = "0.5"
nix = { version = "0.29", features = ["fs"] }

[[bench]]
name = "parse_bench"
harness = false

[[bench]]
name = "query_micro_bench"
harness = false

[[bench]]
name = "rebuild_bench"
harness = false

[[bench]]
name = "rebuild_crud_bench"
harness = false

[[bench]]
name = "runtime_bench"
harness = false

[[bench]]
name = "query_matrix_bench"
harness = false

[[bench]]
name = "redb_persistence_bench"
harness = false

[[bench]]
name = "stdio_boundary_bench"
harness = false

[[bench]]
name = "telemetry_overhead_bench"
harness = false

[[bench]]
name = "session_sync_bench"
harness = false
