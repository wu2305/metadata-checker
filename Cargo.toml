[package]
name = "metadata-checker"
version = "0.1.0"
edition = "2024"

[features]
# grafeo-store 保持单列 feature：C1 尚无生产调用点，默认构建不为未接线引擎付编译代价；
# 待 C2 导入链路接线时再并入 default（见 docs/plans/2026-09-06-m59-grafeo-implementation-plan.md）。
default = ["cli-local"]
cli-local = [
    "dep:clap",
    "dep:redb",
    "dep:fs2",
    "dep:reqwest",
    "reqwest/blocking",
    "reqwest/rustls-tls",
    "reqwest/cookies",
    "reqwest/json",
    "reqwest/gzip",
    "dep:base64",
    "dep:urlencoding",
    "dep:tokio",
    "dep:lz-str",
]
# M59-3 C1：Grafeo 图后端，默认开启（M59 spec §0 已解除体积闸门）。
# 不并入 `cli-local` 而单列：`--no-default-features --features cli-local`
# 就是「不带 grafeo」的对照构建，用来量体积与性能差；browser-wasm 也因此
# 天然不链接 grafeo。
grafeo-store = ["dep:grafeo"]
telemetry = [
    "dep:tracing",
    "dep:tracing-subscriber",
]
telemetry-otlp = [
    "telemetry",
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:tracing-opentelemetry",
    "dep:tokio",
]
browser-wasm = [
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:js-sys",
    "dep:web-sys",
    "dep:reqwest",
]

[[bin]]
name = "metadata-checker"
path = "src/main.rs"
required-features = ["cli-local"]

[[bin]]
name = "generate_browser_offscreen_fixtures"
path = "src/bin/generate_browser_offscreen_fixtures.rs"
required-features = ["cli-local"]

[[bin]]
name = "m51_profile_report"
path = "src/bin/m51_profile_report.rs"
required-features = ["cli-local"]

[[bin]]
name = "m51_core_profile_report"
path = "src/bin/m51_core_profile_report.rs"
required-features = ["cli-local"]

[lib]
name = "metadata_checker"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
regex = "1"
petgraph = "0.8.3"
twox-hash = { version = "2", default-features = false, features = ["xxhash64"] }

# cli-local only
clap = { version = "4", features = ["derive", "help"], optional = true }
redb = { version = "4.1.0", optional = true }
# grafeo-store only：只要 LPG 直写引擎 + 持久化。
# 不用 `lpg` feature——它会连带拉进 cypher / gremlin / sql-pgq 三个用不到的
# 查询语言解析器；`edge` 只开 grafeo-engine/lpg + gql + regex-lite，
# `storage` 补上 wal / grafeo-file / spill / mmap（open / open_read_only / close 所需）。
grafeo = { version = "0.5.43", default-features = false, features = [
    "edge",
    "storage",
], optional = true }
fs2 = { version = "0.4.3", optional = true }
reqwest = { version = "0.12", default-features = false, optional = true }
tokio = { version = "1", features = ["rt-multi-thread"], optional = true }
urlencoding = { version = "2", optional = true }
base64 = { version = "0.22", optional = true }
lz-str = { version = "0.2.1", optional = true }

# telemetry only
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["fmt", "json"], optional = true }
opentelemetry = { version = "0.32", optional = true }
opentelemetry_sdk = { version = "0.32", features = ["metrics"], optional = true }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["trace", "metrics", "http-proto", "reqwest-blocking-client"], optional = true }
tracing-opentelemetry = { version = "0.33", optional = true }

# browser-wasm only
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
js-sys = { version = "0.3", optional = true }
web-sys = { version = "0.3", optional = true, features = [
    "RequestCredentials",
    "RequestInit",
    "Response",
    "Window",
] }

[profile.dev]
# 测试内直接调用 scan_project 扫描真实项目；debug 未优化时代价极高。
# 只优化本 crate 与依赖的代码生成，保留 debug 断言与符号。
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
codegen-units = 1

[profile.release-fast]
inherits = "release"
opt-level = 3

[profile.bench]
inherits = "release-fast"

[dev-dependencies]
criterion = "0.5"
nix = { version = "0.29", features = ["fs"] }

[[bench]]
name = "parse_bench"
harness = false

[[bench]]
name = "query_micro_bench"
harness = false

[[bench]]
name = "rebuild_bench"
harness = false

[[bench]]
name = "rebuild_crud_bench"
harness = false

[[bench]]
name = "runtime_bench"
harness = false

[[bench]]
name = "query_matrix_bench"
harness = false

[[bench]]
name = "redb_persistence_bench"
harness = false

[[bench]]
name = "stdio_boundary_bench"
harness = false

[[bench]]
name = "telemetry_overhead_bench"
harness = false

[[bench]]
name = "session_sync_bench"
harness = false
