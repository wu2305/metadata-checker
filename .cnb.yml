    <<: *runner_amd64_6
  stages:
    - <<: *full_criterion_toolchain_stage
    - <<: *full_criterion_checkout_stage
    - <<: *full_criterion_preflight_stage
    - <<: *full_criterion_warmup_boundary_stage
