.browser_wasm_ci_image: &browser_wasm_ci_image
  build:
    dockerfile: .cnb/images/browser-wasm-ci.Dockerfile
    # CNB: 未列入 by 的文件在 docker build 上下文中视为不存在；Dockerfile COPY 了 Cargo.toml
    by:
      - .cnb/images/browser-wasm-ci.Dockerfile
      - Cargo.toml
      - Cargo.lock
    versionBy:
      - .cnb/images/browser-wasm-ci.Dockerfile
      - Cargo.toml
      - Cargo.lock

# ponytail: 快 gate 降配 CPU；full criterion 保持 8 核编译与 bench
.runner_amd64_2: &runner_amd64_2
  tags: cnb:arch:amd64
  cpus: 2

.runner_amd64_4: &runner_amd64_4
  tags: cnb:arch:amd64
  cpus: 4

.runner_amd64_6: &runner_amd64_6
  tags: cnb:arch:amd64
  cpus: 6

.runner_amd64_8: &runner_amd64_8
  tags: cnb:arch:amd64
  cpus: 8

.rust_ci: &rust_ci
  name: rust-ci
  runner:
    <<: *runner_amd64_4
  docker:
    <<: *browser_wasm_ci_image
    volumes:
      - /usr/local/cargo/registry
      - /usr/local/cargo/git
      - ./target
  env:
    CARGO_TARGET_DIR: target/cnb/coverage
  stages:
    - name: toolchain
      script: |
        rustc --version
        cargo --version
        cargo llvm-cov --version
    - name: format
      script: cargo fmt --check
    - name: check benches
      script: cargo check --benches
    # AI 评测执行测试之前被整条排除，因为语料里的真实项目 case 指向维护者本机路径，
    # 在 CI 上必然失败。现在缺语料由测试内的存在性门禁显式跳过，
    # fixture case 可以正常在 CI 跑——继续 skip 只会让 AI 评测集的回归无人发现。
    - name: test and coverage
      script: |
        rm -rf target/debug
        mkdir -p target target/cnb/coverage/llvm-cov-target
        ln -sfn cnb/coverage/llvm-cov-target/debug target/debug
        cargo llvm-cov test \
          --workspace \
          --lcov \
          --output-path lcov.info \
          -- \
          --test-threads=1
        test -s lcov.info
    - name: report rust coverage
      type: testing:coverage
      options:
        key: rust
        name: Rust 单元测试覆盖率
        pattern: lcov.info
        allowExts: .rs
        breakIfNoCoverage: true
      exports:
        lines: RUST_COVERAGE_LINES
    - name: coverage summary
      script: |
        echo "Rust coverage lines: ${RUST_COVERAGE_LINES:-NA}%"
    - name: browser wasm check
      script: |
        cargo check --no-default-features --features browser-wasm --target wasm32-unknown-unknown

.browser_offscreen_bench_ci: &browser_offscreen_bench_ci
  name: browser-offscreen-bench-ci
  ifModify:
    - src/**
    - browser/**
    - Cargo.toml
    - Cargo.lock
    - tests/fixtures/browser-offscreen-real-project/**
  runner:
    <<: *runner_amd64_2
  docker:
    <<: *browser_wasm_ci_image
    volumes:
      - /usr/local/cargo/registry
      - /usr/local/cargo/git
      - ./target/cnb/browser-offscreen
  env:
    CARGO_TARGET_DIR: target/cnb/browser-offscreen
  stages:
    - name: toolchain
      script: |
        node --version
        rustc --version
        cargo --version
        wasm-bindgen --version
    - name: perf browser offscreen ci
      script: |
        make perf-browser-offscreen-ci
        ls -la target/browser-offscreen-bench/
    - name: report browser offscreen to bencher
      script: |
        node browser/bench/offscreen-summary-to-bencher-bmf.mjs \
          --summary target/browser-offscreen-bench/browser-offscreen-summary.json \
          --output target/browser-offscreen-bench/browser-offscreen-bencher-bmf.json \
          --stats p50
        if [ -z "${BENCHER_API_KEY:-}" ] || [ -z "${BENCHER_PROJECT:-}" ]; then
          echo "skip Bencher report: BENCHER_API_KEY or BENCHER_PROJECT is not configured"
          exit 0
        fi
        if ! bencher run \
          --project "$BENCHER_PROJECT" \
          --branch "${CNB_BRANCH:-local}" \
          --testbed "${BENCHER_TESTBED:-cnb-amd64}" \
          --adapter json \
          --file target/browser-offscreen-bench/browser-offscreen-bencher-bmf.json; then
          if [ "${BENCHER_UPLOAD_REQUIRED:-false}" = "true" ]; then
            exit 1
          fi
          echo "warning: Bencher browser offscreen report failed"
        fi
  endStages:
    - name: bench artifact summary
      script: |
        test -f target/browser-offscreen-bench/browser-offscreen-summary.md
        wc -l target/browser-offscreen-bench/browser-offscreen-bench.jsonl
        head -n 20 target/browser-offscreen-bench/browser-offscreen-summary.md
        node browser/bench/write-ci-perf-index.mjs --output-dir target/browser-offscreen-bench
        cat target/browser-offscreen-bench/browser-offscreen-ci-perf-index.json

.browser_offscreen_bench_ci_with_bencher: &browser_offscreen_bench_ci_with_bencher
  <<: *browser_offscreen_bench_ci
  imports:
    - https://cnb.cool/wu2305/metadata-checker-keys/-/blob/main/bencher.yml

.fixture_bench_ci: &fixture_bench_ci
  name: fixture-bench-ci
  ifModify:
    - src/**
    - benches/**
    - Cargo.toml
    - Cargo.lock
    - tests/fixtures/**
  runner:
    <<: *runner_amd64_4
  docker:
    <<: *browser_wasm_ci_image
    volumes:
      - /usr/local/cargo/registry
      - /usr/local/cargo/git
      - ./target/criterion-ci
  imports:
    - https://cnb.cool/wu2305/metadata-checker-keys/-/blob/main/bencher.yml
  stages:
    - name: criterion warmup
      script: |
        rm -rf target/criterion-ci/warmup-fixture target/criterion-ci/parse target/criterion-ci/query-micro
        CARGO_TARGET_DIR=target/criterion-ci/warmup-fixture \
          cargo build --profile release-fast --lib --bins
    - name: criterion fixture benches
      script: |
        node tools/run-bencher-criterion-ci.mjs \
          --bench parse_bench \
          --target-dir target/criterion-ci/parse \
          -- --sample-size 10 --warm-up-time 1 --measurement-time 2 --nresamples 1000 --noplot
        node tools/run-bencher-criterion-ci.mjs \
          --bench query_micro_bench \
          --target-dir target/criterion-ci/query-micro \
          -- --sample-size 10 --warm-up-time 1 --measurement-time 2 --nresamples 1000 --noplot

.full_criterion_bench_shell: &full_criterion_bench_shell
  runner:
    <<: *runner_amd64_8
  docker:
    <<: *browser_wasm_ci_image
    volumes:
      - /usr/local/cargo/registry
      - /usr/local/cargo/git
      - ./target/criterion-ci
  imports:
    - https://cnb.cool/wu2305/metadata-checker-keys/-/blob/main/bencher.yml
    - https://cnb.cool/wu2305/metadata-checker-keys/-/blob/main/real-fixture.yml

.full_criterion_toolchain_stage: &full_criterion_toolchain_stage
  name: toolchain
  script: |
    node --version
    rustc --version
    cargo --version
    bencher --version

.full_criterion_checkout_stage: &full_criterion_checkout_stage
  name: checkout real project fixture
  script: |
    if [ -n "${METADATA_CHECKER_REAL_PROJECT_DIR:-}" ]; then
      echo "use preconfigured METADATA_CHECKER_REAL_PROJECT_DIR"
      echo "##[set-output real_project_dir=${METADATA_CHECKER_REAL_PROJECT_DIR}]"
      exit 0
    fi

    if [ -z "${REAL_PROJECT_FIXTURE_DEPLOY_TOKEN:-}" ]; then
      echo "REAL_PROJECT_FIXTURE_DEPLOY_TOKEN is required to clone the real-project fixture repository"
      exit 1
    fi

    FIXTURE_REPO_URL="${REAL_PROJECT_FIXTURE_REPO_URL:-}"
    if [ -z "$FIXTURE_REPO_URL" ]; then
      if [ -z "${REAL_PROJECT_FIXTURE_REPO_SLUG:-}" ]; then
        echo "REAL_PROJECT_FIXTURE_REPO_URL or REAL_PROJECT_FIXTURE_REPO_SLUG is required"
        exit 1
      fi
      FIXTURE_REPO_URL="https://cnb.cool/${REAL_PROJECT_FIXTURE_REPO_SLUG}.git"
    fi

    FIXTURE_ROOT="/tmp/metadata-checker-real-fixtures"
    rm -rf "$FIXTURE_ROOT"
    git config --global credential.helper store
    printf "https://cnb:%s@cnb.cool\n" "$REAL_PROJECT_FIXTURE_DEPLOY_TOKEN" > "$HOME/.git-credentials"
    chmod 0600 "$HOME/.git-credentials"
    git clone "$FIXTURE_REPO_URL" "$FIXTURE_ROOT"

    if [ -n "${REAL_PROJECT_FIXTURE_REF:-}" ]; then
      git -C "$FIXTURE_ROOT" checkout "$REAL_PROJECT_FIXTURE_REF"
    fi

    REAL_PROJECT_DIR="$FIXTURE_ROOT/${REAL_PROJECT_FIXTURE_PROJECT_PATH:-xiaoshouyi}"
    echo "##[set-output real_project_dir=${REAL_PROJECT_DIR}]"
  exports:
    real_project_dir: METADATA_CHECKER_REAL_PROJECT_DIR

.full_criterion_preflight_stage: &full_criterion_preflight_stage
  name: real project preflight
  script: |
    if [ -z "${METADATA_CHECKER_REAL_PROJECT_DIR:-}" ]; then
      echo "METADATA_CHECKER_REAL_PROJECT_DIR is required for full real-project benchmarks"
      exit 1
    fi
    test -d "$METADATA_CHECKER_REAL_PROJECT_DIR"
    METADATA_FILE_COUNT="$(find "$METADATA_CHECKER_REAL_PROJECT_DIR" \( -name '*.spg' -o -name '*.tbl' \) | wc -l)"
    test "$METADATA_FILE_COUNT" -gt 0
    find "$METADATA_CHECKER_REAL_PROJECT_DIR" \( -name '*.spg' -o -name '*.tbl' \) | head -n 20

.full_criterion_warmup_query_stage: &full_criterion_warmup_query_stage
  name: criterion warmup
  script: |
    rm -rf target/criterion-ci/warmup-query
    CARGO_TARGET_DIR=target/criterion-ci/warmup-query \
      cargo build --profile release-fast --lib --bins

.full_criterion_warmup_rebuild_stage: &full_criterion_warmup_rebuild_stage
  name: criterion warmup
  script: |
    rm -rf target/criterion-ci/warmup-rebuild target/criterion-ci/rebuild
    CARGO_TARGET_DIR=target/criterion-ci/warmup-rebuild \
      cargo build --profile release-fast --lib --bins

.full_criterion_warmup_rebuild_crud_stage: &full_criterion_warmup_rebuild_crud_stage
  name: criterion warmup
  script: |
    rm -rf target/criterion-ci/warmup-rebuild-crud target/criterion-ci/rebuild-crud
    CARGO_TARGET_DIR=target/criterion-ci/warmup-rebuild-crud \
      cargo build --profile release-fast --lib --bins

.full_criterion_warmup_redb_stage: &full_criterion_warmup_redb_stage
  name: criterion warmup
  script: |
    rm -rf target/criterion-ci/warmup-redb target/criterion-ci/redb
    CARGO_TARGET_DIR=target/criterion-ci/warmup-redb \
      cargo build --profile release-fast --lib --bins

.full_criterion_warmup_boundary_stage: &full_criterion_warmup_boundary_stage
  name: criterion warmup
  script: |
    rm -rf \
      target/criterion-ci/warmup-boundary \
      target/criterion-ci/warmup-boundary-telemetry \
      target/criterion-ci/stdio \
      target/criterion-ci/telemetry \
      target/criterion-ci/session
    CARGO_TARGET_DIR=target/criterion-ci/warmup-boundary \
      cargo build --profile release-fast --lib --bins
    CARGO_TARGET_DIR=target/criterion-ci/warmup-boundary-telemetry \
      cargo build --profile release-fast --features telemetry --lib

.full_criterion_query_ci: &full_criterion_query_ci
  <<: *full_criterion_bench_shell
  name: full-criterion-query-ci
  stages:
    - <<: *full_criterion_toolchain_stage
    - <<: *full_criterion_checkout_stage
    - <<: *full_criterion_preflight_stage
    - <<: *full_criterion_warmup_query_stage
    - name: query matrix bench
      script: |
        rm -rf target/criterion-ci/query-matrix target/criterion-ci/runtime
        node tools/run-bencher-criterion-ci.mjs \
          --bench query_matrix_bench \
          --target-dir target/criterion-ci/query-matrix
    - name: runtime lifecycle bench
      script: |
        node tools/run-bencher-criterion-ci.mjs \
          --bench runtime_bench \
          --target-dir target/criterion-ci/runtime
    - name: M51 page logic profile report
      script: |
        mkdir -p target/criterion-ci/reports
        CARGO_TARGET_DIR=target/criterion-ci/warmup-query \
          cargo run --profile release-fast --bin m51_profile_report -- \
            --project-dir "$METADATA_CHECKER_REAL_PROJECT_DIR" \
            --output target/criterion-ci/reports/m51-page-logic-profile.json \
            --sample-count 3
        test -s target/criterion-ci/reports/m51-page-logic-profile.json
        head -c 4000 target/criterion-ci/reports/m51-page-logic-profile.json
    - name: M51 core profile report
      script: |
        mkdir -p target/criterion-ci/reports
        CARGO_TARGET_DIR=target/criterion-ci/warmup-query \
          cargo run --profile release-fast --bin m51_core_profile_report -- \
            --project-dir "$METADATA_CHECKER_REAL_PROJECT_DIR" \
            --output target/criterion-ci/reports/m51-core-profile.json \
            --sample-count 1
        test -s target/criterion-ci/reports/m51-core-profile.json
        head -c 4000 target/criterion-ci/reports/m51-core-profile.json

.full_criterion_rebuild_ci: &full_criterion_rebuild_ci
  <<: *full_criterion_bench_shell
  name: full-criterion-rebuild-ci
  stages:
