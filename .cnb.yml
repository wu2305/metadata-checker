          --target-dir target/criterion-ci/session

# kimi-code CLI 安装步骤在 cloud-native-dev-env 与 kimi-code-harness-smoke 中各内联一份
#（CNB schema 要求顶层锚点必须是 array/object，无法给裸脚本字符串做锚点复用）。
# install.sh 把二进制装到 ~/.kimi-code/bin（PATH 写进 ~/.bashrc，但 CI stage 不 source 它）；
# 软链进 /usr/local/bin 保证后续 stage 与远程 SSH 会话不依赖 PATH 也能直接命中 kimi。

.cloud_native_dev_env: &cloud_native_dev_env
  name: cloud-native-dev-env
  runner:
    tags: cnb:arch:amd64
  docker:
    <<: *browser_wasm_ci_image
    volumes:
      - /usr/local/cargo/registry
      - /usr/local/cargo/git
      - ./target/cnb/workspace
  services:
    # 默认 10 分钟检测不到 http/ssh 心跳就关环境；远程 SSH 里两次操作之间
    # 很容易超过 10 分钟，放宽到 1 小时避免会话被回收。
    - name: vscode
      options:
        keepAliveTimeout: 1h
    - docker
  env:
    CARGO_TARGET_DIR: target/cnb/workspace
  stages:
    - name: toolchain
      script: |
        node --version
        rustc --version
        cargo --version
        wasm-bindgen --version
        bencher --version
    # Remote-SSH 的前置条件在镜像里（.cnb/images/browser-wasm-ci.Dockerfile 预装
    # openssh-server）。这里只做断言：缺了就在开环境时立刻失败，
    # 而不是等到 VSCode/Cursor 连不上才发现。
    - name: remote ssh preflight
      script: |
        test -x /usr/sbin/sshd || command -v sshd
        test -d /run/sshd
    - name: fetch dependencies
      script: cargo fetch
    - name: install kimi-code
      script: |
        curl -fsSL https://code.kimi.com/kimi-code/install.sh | bash
        export PATH="$HOME/.local/bin:$PATH"
        KIMI_BIN="$(command -v kimi || true)"
        for KCAND in "$HOME/.kimi-code/bin/kimi" "$HOME/.local/bin/kimi"; do
          if [ -z "$KIMI_BIN" ] && [ -x "$KCAND" ]; then KIMI_BIN="$KCAND"; fi
        done
        test -n "$KIMI_BIN"
        ln -sf "$KIMI_BIN" /usr/local/bin/kimi
        kimi --version
    - name: configure kimi-code cnb-ai-chat provider
      script: |
        # 目标：开发环境创建完成后，用户打开终端即可 `kimi`，默认模型走 CNB AI Chat。
        # endpoint 契约：POST https://api.cnb.cool/{repo}/-/ai/chat/completions，
        # 仅支持 stream=true，认证用构建凭证 CNB_TOKEN。
        # kimi-code 不从 shell 环境读凭证，api_key 必须落在 config.toml；
        # vscode 事件若未注入 CNB_TOKEN，则写入占位符并打印手工配置指引，不让开环境失败。
        mkdir -p "$HOME/.kimi-code"
        KC_BASE_URL="https://api.cnb.cool/${CNB_REPO_SLUG:-OWNER/REPO}/-/ai"
        KC_API_KEY="${CNB_TOKEN:-__PUT_CNB_TOKEN_HERE__}"
        {
          echo '# 由 .cnb.yml cloud-native-dev-env configure 阶段生成，可手工修改'
          echo 'default_model = "cnb-ai-chat/deepseek-v4-flash"'
          echo ''
          echo '[providers.cnb-ai-chat]'
          echo 'type = "openai"'
          echo "base_url = \"${KC_BASE_URL}\""
          echo "api_key = \"${KC_API_KEY}\""
          echo ''
          echo '[models."cnb-ai-chat/deepseek-v4-flash"]'
          echo 'provider = "cnb-ai-chat"'
          echo 'model = "deepseek-v4-flash"'
          echo '# max_context_size 是保守估计值，按网关实际窗口调整'
          echo 'max_context_size = 131072'
          echo 'capabilities = ["tool_use"]'
        } > "$HOME/.kimi-code/config.toml"
        chmod 600 "$HOME/.kimi-code/config.toml"
        # metadata-checker 使用协议挂到用户级 skill 目录，环境内任意 kimi 会话可发现。
        mkdir -p "$HOME/.agents/skills/metadata-checker"
        cp SKILL.md "$HOME/.agents/skills/metadata-checker/SKILL.md"
        if [ "$KC_API_KEY" = "__PUT_CNB_TOKEN_HERE__" ]; then
          echo "[kimi-code] 当前事件未注入 CNB_TOKEN，config.toml 已写入占位符。"
          echo "[kimi-code] 使用前把 ~/.kimi-code/config.toml 的 api_key 换成有效 token，"
          echo "[kimi-code] 或用 KIMI_MODEL_NAME/KIMI_MODEL_API_KEY/KIMI_MODEL_BASE_URL 临时注入。"
        else
          kimi doctor config
          echo "[kimi-code] provider=cnb-ai-chat default_model=cnb-ai-chat/deepseek-v4-flash 配置完成"
        fi

# ponytail: stage 级 if 跳过 main，避免与 main.push 重复跑 rust-ci
.rust_ci_branch_push: &rust_ci_branch_push
  name: rust-ci-branch-push
  runner:
    <<: *runner_amd64_2
  docker:
    <<: *browser_wasm_ci_image
    volumes:
      - /usr/local/cargo/registry
      - /usr/local/cargo/git
      - ./target
  env:
    CARGO_TARGET_DIR: target/cnb/coverage
  stages:
    # 同 main 分支：AI 评测执行测试不再被排除，
    # 缺真实项目语料现在是测试内的显式跳过，而不是整条测试消失。
    - name: rust ci
      if: '[ "$CNB_BRANCH" != "main" ]'
      script: |
        rustc --version
        cargo --version
        cargo llvm-cov --version
        cargo fmt --check
        cargo check --benches
        rm -rf target/debug
        mkdir -p target target/cnb/coverage/llvm-cov-target
        ln -sfn cnb/coverage/llvm-cov-target/debug target/debug
        cargo llvm-cov test \
          --workspace \
          --lcov \
          --output-path lcov.info \
          -- \
          --test-threads=1
        test -s lcov.info
        cargo check --no-default-features --features browser-wasm --target wasm32-unknown-unknown

.pr_fast_ci: &pr_fast_ci
  - *rust_ci
  - *browser_offscreen_bench_ci

.main_authoritative_ci: &main_authoritative_ci
  - *rust_ci
  - *browser_offscreen_bench_ci_with_bencher
  - *fixture_bench_ci
  - *full_criterion_query_ci
  - *full_criterion_rebuild_ci
  - *full_criterion_rebuild_crud_ci
  - *full_criterion_redb_ci
  - *full_criterion_boundary_ci

.m58_cnb_llm_ci: &m58_cnb_llm_ci
  name: m58-cnb-llm-eval
  runner:
    <<: *runner_amd64_4
  docker:
    <<: *browser_wasm_ci_image
    volumes:
      - /usr/local/cargo/registry
      - /usr/local/cargo/git
      - ./target/cnb/m58-ai-eval-build
      - ./target/m58-ai-eval
  env:
    CARGO_TARGET_DIR: target/cnb/m58-ai-eval-build
    M58_AI_EVAL_OUTPUT_DIR: target/m58-ai-eval
    M58_AI_EVAL_TRIALS: "3"
  stages:
    - name: toolchain
      script: |
        rustc --version
        cargo --version
    - name: runtime contract preflight
      script: |
        test -n "${CNB_TOKEN:-}"
        test -n "${CNB_REPO_SLUG:-}"

        (
          unset M58_CNB_REPO M58_CNB_MODEL
          export M58_CNB_REPO="${M58_CNB_REPO:-${CNB_REPO_SLUG:?}}"
          export M58_CNB_MODEL="${M58_CNB_MODEL:-deepseek-v4-flash}"
          test "${M58_CNB_REPO}" = "${CNB_REPO_SLUG}"
          test "${M58_CNB_MODEL}" = "deepseek-v4-flash"
        )

        (
          export M58_CNB_REPO="override/repo"
          export M58_CNB_MODEL="override-model"
          export M58_CNB_REPO="${M58_CNB_REPO:-${CNB_REPO_SLUG:?}}"
          export M58_CNB_MODEL="${M58_CNB_MODEL:-deepseek-v4-flash}"
          test "${M58_CNB_REPO}" = "override/repo"
          test "${M58_CNB_MODEL}" = "override-model"
        )
    - name: build release binary
      script: cargo build --release --features cli-local --bin metadata-checker
    - name: run CNB fixture baseline
      script: |
        export M58_CNB_REPO="${M58_CNB_REPO:-${CNB_REPO_SLUG:?}}"
        export M58_CNB_MODEL="${M58_CNB_MODEL:-deepseek-v4-flash}"
        # 不设置时完全不发 reasoning_effort，请求体与历史基线逐字节相同。
        # 设为 low/medium/high 会打开模型思考（实测：不带该字段时 reasoning_content 恒为空，
        # 该 build 的 ai-audit 也显示 thinking_tokens=0）。
        export M58_CNB_REASONING_EFFORT="${M58_CNB_REASONING_EFFORT:-}"
        test "${M58_AI_EVAL_TRIALS:-0}" -gt 1
        test -n "${CNB_TOKEN:-}"
        test -f target/cnb/m58-ai-eval-build/release/metadata-checker
        export M58_METADATA_CHECKER_BIN="$PWD/target/cnb/m58-ai-eval-build/release/metadata-checker"
        cargo test --features cli-local --test m58_cnb_ai_runner_tests -- --ignored --nocapture
  endStages:
    - name: report structured summary
      script: |
        test -s target/m58-ai-eval/run.json
        test -s target/m58-ai-eval/run.md
        echo "M58 RunReport: target/m58-ai-eval/run.json"
        # 这里必须整份 cat run.md，不能再用 grep 逐字段捞。
        # grep 只匹配键名所在行，failure_classes / command_trace_stats 这类聚合对象的
        # 体永远打不出来，`grep -A N` 又会把命令轨迹从中间截断——两种都让 CI 日志无法复盘，
        # 只能回到本地重跑。run.md 由 render_report_markdown 从同一份 RunReport 投影而来，
        # 是确定性的且不含模型原文，本身就是给人看的那一份。
        cat target/m58-ai-eval/run.md

# M58 哑协议 runner 的对照实验：同一廉价模型（deepseek-v4-flash，CNB AI Chat endpoint），
# 但换成真实 agent harness（kimi-code CLI）+ SKILL.md skill。harness 场景没有命令白名单、
# 没有 trial 截杀，模型自己读 SKILL.md、自己从命令错误里恢复——这才是要验证的部署配置。
# 只由 api_trigger 手动触发，属于发现性实验，不进任何 CI 阻塞层。
.kimi_harness_smoke_ci: &kimi_harness_smoke_ci
  name: kimi-code-harness-smoke
  runner:
    <<: *runner_amd64_4
  docker:
    <<: *browser_wasm_ci_image
    volumes:
      - /usr/local/cargo/registry
      - /usr/local/cargo/git
      - ./target/cnb/kimi-harness-build
      - ./target/kimi-harness-smoke
  env:
    CARGO_TARGET_DIR: target/cnb/kimi-harness-build
    KIMI_CODE_HOME: target/kimi-harness-smoke/kimi-home
    KIMI_DISABLE_TELEMETRY: "1"
    KIMI_CODE_NO_AUTO_UPDATE: "1"
  stages:
    - name: install kimi-code
      script: |
        curl -fsSL https://code.kimi.com/kimi-code/install.sh | bash
        export PATH="$HOME/.local/bin:$PATH"
        KIMI_BIN="$(command -v kimi || true)"
        for KCAND in "$HOME/.kimi-code/bin/kimi" "$HOME/.local/bin/kimi"; do
          if [ -z "$KIMI_BIN" ] && [ -x "$KCAND" ]; then KIMI_BIN="$KCAND"; fi
        done
        test -n "$KIMI_BIN"
        ln -sf "$KIMI_BIN" /usr/local/bin/kimi
        kimi --version
    - name: build release binary
      script: cargo build --release --features cli-local --bin metadata-checker
    - name: probe CNB AI Chat endpoint
      script: |
        # 探测两个能力：
        # 1) 基础流式补全（契约要求 stream=true；M58 实测 stream=false 返回 400）
        # 2) 原生 tool calling —— kimi-code 作为 harness 依赖它。当前 Swagger 契约未公开
        #    tools/tool_calls 字段，这里给实测结论。若不支持就带明确诊断失败，
        #    避免跑出「kimi 全程没调工具」的假性结论还被当成模型能力问题。
        # 脱敏约定：token 只出现在 Authorization header，永不打印请求头；
        # 响应 body 不含凭证，失败时只截前 2000 字节做诊断。
        test -n "${CNB_TOKEN:-}"
        test -n "${CNB_REPO_SLUG:-}"
        CHAT_URL="https://api.cnb.cool/${CNB_REPO_SLUG}/-/ai/chat/completions"
        OUT_DIR="target/kimi-harness-smoke"
        mkdir -p "$OUT_DIR"

        BASIC_CODE="$(curl -sS -N -o "$OUT_DIR/probe_basic.sse" -w '%{http_code}' \
          -X POST "$CHAT_URL" \
          -H "Authorization: Bearer ${CNB_TOKEN}" \
          -H 'Content-Type: application/json' \
          -H 'Accept: text/event-stream' \
          -d '{"model":"deepseek-v4-flash","stream":true,"messages":[{"role":"user","content":"Reply with the single word: ok"}]}')"
        echo "basic chat probe http=${BASIC_CODE}"
        test "$BASIC_CODE" = "200"
        grep -q '^data:' "$OUT_DIR/probe_basic.sse"
        grep -q '\[DONE\]' "$OUT_DIR/probe_basic.sse"

        TOOLS_CODE="$(curl -sS -N -o "$OUT_DIR/probe_tools.sse" -w '%{http_code}' \
          -X POST "$CHAT_URL" \
          -H "Authorization: Bearer ${CNB_TOKEN}" \
          -H 'Content-Type: application/json' \
          -H 'Accept: text/event-stream' \
          -d '{"model":"deepseek-v4-flash","stream":true,"messages":[{"role":"user","content":"What is the weather in Beijing right now?"}],"tools":[{"type":"function","function":{"name":"get_current_weather","description":"Get the current weather of a city","parameters":{"type":"object","properties":{"city":{"type":"string"}},"required":["city"]}}}],"tool_choice":"required"}')"
        echo "tool calling probe http=${TOOLS_CODE}"
        if [ "$TOOLS_CODE" != "200" ]; then
          echo "KIMI_HARNESS_TOOL_CALLING=unsupported(http ${TOOLS_CODE})"
          echo "CNB AI Chat 拒绝 tools 字段；kimi-code harness 需要原生 tool calling，实验到此为止。"
          head -c 2000 "$OUT_DIR/probe_tools.sse"
          exit 1
        fi
        if ! grep -q 'tool_calls' "$OUT_DIR/probe_tools.sse"; then
          echo "KIMI_HARNESS_TOOL_CALLING=no_tool_calls_in_response"
          echo "endpoint 接受请求但未返回 tool_calls；kimi-code 无法作为 harness 工作。"
          head -c 2000 "$OUT_DIR/probe_tools.sse"
          exit 1
        fi
        echo "KIMI_HARNESS_TOOL_CALLING=supported"
    - name: fetch real project corpus
      script: |
        # 验证 CNB_TOKEN 跨仓库 clone：把真实项目语料（succbi_project_container 里的
        # projects/xiaoshouyi，约 156MB）sparse 拉进工作区，为真实项目冒烟铺路。
        # 凭证只走 http.extraHeader 请求头，不落盘、不进 remote URL、日志不回显展开值。
        test -n "${CNB_TOKEN:-}"
        REAL_DIR="target/real-project/succbi_project_container"
        AUTH_HEADER="Authorization: Basic $(printf '%s:%s' "${CNB_TOKEN_USER_NAME:-cnb}" "${CNB_TOKEN:?}" | base64 -w0)"
        rm -rf "$REAL_DIR"
        # git 的报错走 stderr，显式 2>&1 合流，否则 CNB 日志只剩 Cloning into 一行无法归因。
        # 语料在 cnb 的 xiaoshouyi-corpus 分支（succbi_project_container 的 main 是
        # 无关历史，只有 projects/ACT，没有 xiaoshouyi）。
        if ! git -c http.extraHeader="$AUTH_HEADER" clone --depth 1 --filter=blob:none --sparse \
            --branch xiaoshouyi-corpus \
            "https://cnb.cool/wu2305/succbi_project_container.git" "$REAL_DIR" 2>&1; then
          echo "partial clone 失败，去掉 blob filter 重试"
          git -c http.extraHeader="$AUTH_HEADER" clone --depth 1 --sparse \
            --branch xiaoshouyi-corpus \
            "https://cnb.cool/wu2305/succbi_project_container.git" "$REAL_DIR" 2>&1
        fi
        git -C "$REAL_DIR" sparse-checkout set projects/xiaoshouyi
        test -d "$REAL_DIR/projects/xiaoshouyi"
        SPG_COUNT="$(find "$REAL_DIR/projects/xiaoshouyi" -name '*.spg' | wc -l)"
        TBL_COUNT="$(find "$REAL_DIR/projects/xiaoshouyi" -name '*.tbl' | wc -l)"
        echo "REAL_PROJECT_READY spg=${SPG_COUNT} tbl=${TBL_COUNT}"
        test "$SPG_COUNT" -gt 0
        du -sh "$REAL_DIR/projects/xiaoshouyi"
        if grep -qF "$CNB_TOKEN" "$REAL_DIR/.git/config" 2>/dev/null; then
          echo "CNB_TOKEN persisted in git config"
          exit 1
        fi
    - name: kimi-code harness smoke run
      script: |
        # 本 stage 按 POSIX sh 写，不用 bash 专属语法：CNB stage 脚本默认由 sh 执行，
        # 本镜像是 Debian 系（sh = dash）。这条不是洁癖——`IFS=$'\t'` 在 dash 下会被
        # 当成字面量 $ ' \ t，按字母 t 切分，产出的是碎掉的 case_id 和垃圾问题文本，
        # 而退出码、记录数断言、token 检查全部照常通过：一次完美的静默假绿。
        # set -eu 同样是必需的：下面的记录数硬断言、空子集拒绝和各处 test -s
        # 全部依赖 errexit 才有意义，没有它们只是打印错误然后继续。
        set -eu

        # KIMI_MODEL_* 是官方临时模型通道：从环境变量合成 in-memory provider，
        # 不落盘 config.toml，CNB_TOKEN 不会写进任何文件。
        export KIMI_MODEL_NAME="deepseek-v4-flash"
        export KIMI_MODEL_PROVIDER_TYPE="openai"
        export KIMI_MODEL_API_KEY="${CNB_TOKEN:?}"
        export KIMI_MODEL_BASE_URL="https://api.cnb.cool/${CNB_REPO_SLUG:?}/-/ai"
        export KIMI_MODEL_MAX_CONTEXT_SIZE="131072"
        export KIMI_MODEL_CAPABILITIES="tool_use"

        OUT_DIR="target/kimi-harness-smoke"
        mkdir -p "$OUT_DIR/skills/metadata-checker" "$KIMI_CODE_HOME"
        cp SKILL.md "$OUT_DIR/skills/metadata-checker/SKILL.md"
        ln -sf "$PWD/target/cnb/kimi-harness-build/release/metadata-checker" /usr/local/bin/metadata-checker

        # 问题文本不在本文件里。唯一事实源是 xiaoshouyi_large_real_cases.json 的
        # cases[].smoke：`enabled` 选子集，`order` 定顺序，`question_template` 里的
        # {project_dir} 由本 stage 代入。此前六问是六段复制粘贴的 bash，问题文本与断言
        # 分居两处，改一个 case 要动两个文件。
        # 每问独立 kimi -p（全新上下文），问题自带项目路径（harness 里没有 runner
        # 代填 project-dir，真实用户也得自己说）。
        # 不预建图：模型是否按 SKILL.md 自己 check-graph → build-graph → query
        # 正是被测行为的一部分。图构建成本因此计入每问墙钟。
        REAL_PROJECT_DIR="target/real-project/succbi_project_container/projects/xiaoshouyi"
        test -d "$REAL_PROJECT_DIR"

        CASES_JSON="tests/fixtures/corpus/ai_eval/xiaoshouyi_large_real_cases.json"
        RECORDS="$OUT_DIR/records.jsonl"
        QUESTIONS_TSV="$OUT_DIR/smoke-questions.tsv"
        : > "$RECORDS"

        # 镜像里没有 jq（base 是 node:22-bookworm），JSON 一律用 node 读写：
        # 手拼 JSON 会在问题文本含引号时产出坏行，而坏行下游是静默失败。
        node -e '
          const fs = require("fs");
          const [casesPath, projectDir] = process.argv.slice(1);
          const doc = JSON.parse(fs.readFileSync(casesPath, "utf8"));
          const rows = doc.cases
            .filter((c) => c.smoke && c.smoke.enabled)
            .sort((a, b) => a.smoke.order - b.smoke.order)
            .map((c) => {
              const q = c.smoke.question_template.replace(/\{project_dir\}/g, projectDir);
              // TSV 只在问题是单行且无制表符时安全，这里显式守住而不是假设。
              if (/[\t\r\n]/.test(q)) throw new Error("question has tab/newline: " + c.case_id);
              return [c.case_id, c.smoke.order, c.difficulty, q].join("\t");
            });
          if (rows.length === 0) throw new Error("no smoke-enabled cases in " + casesPath);
          // order 撞号时排序结果退化为 fixture 物理序，静默且不可复现，直接判错。
          const orders = doc.cases.filter((c) => c.smoke && c.smoke.enabled).map((c) => c.smoke.order);
          if (new Set(orders).size !== orders.length) {
            throw new Error("duplicate smoke.order among enabled cases: " + orders.join(","));
          }
          if (orders.some((o) => !Number.isInteger(o) || o < 1)) {
            throw new Error("smoke.order must be an integer >= 1: " + orders.join(","));
          }
          process.stdout.write(rows.join("\n") + "\n");
        ' "$CASES_JSON" "$REAL_PROJECT_DIR" > "$QUESTIONS_TSV"
        echo "SMOKE_CASE_COUNT=$(wc -l < "$QUESTIONS_TSV")"

        # variant / trial 现在恒为 baseline / 1，但字段先占位：Phase 2 加 prompt 变体
        # 与重复次数时，record schema 不需要再变，下游 grid 也不用改读法。
        VARIANT="${KIMI_SMOKE_VARIANT:-baseline}"
        TRIAL="${KIMI_SMOKE_TRIAL:-1}"

        # 硬断言只留 infra 级（kimi 退出码、transcript 非空、token 泄漏）；
        # 是否调用 metadata-checker 只软报告不判红——真实文件读不动时
        # 绕过工具是数据信号，不是故障。
        # POSIX 下拿一个真制表符只能这样：`IFS=$'\t'` 是 bash 专属。
        TAB="$(printf '\t')"
        INFRA_FAILED=0
        while IFS="$TAB" read -r CASE_ID ORDER DIFFICULTY QUESTION; do
          TRANSCRIPT="$OUT_DIR/smoke-transcript-${CASE_ID}.jsonl"
          STDERR_LOG="$OUT_DIR/smoke-stderr-${CASE_ID}.log"
          CASE_EXIT=0
          # 墙钟是 Phase 2 的预算输入：variant × case × trial 的总时长要从实测推，
          # 不是拍脑袋。含模型自己建图的时间，这正是要量的那部分。
          START_MS="$(date +%s%3N)"
          timeout 1800 kimi -p "$QUESTION" \
            --skills-dir "$PWD/$OUT_DIR/skills" \
            --output-format stream-json \
            > "$TRANSCRIPT" \
            2> "$STDERR_LOG" || CASE_EXIT=$?
          END_MS="$(date +%s%3N)"

          TOOL_CALLS="$(grep -c '"tool_calls"' "$TRANSCRIPT" 2>/dev/null || true)"
          MC_INVOCATIONS="$(grep -c 'metadata-checker' "$TRANSCRIPT" 2>/dev/null || true)"
          TRANSCRIPT_BYTES="$(wc -c < "$TRANSCRIPT" 2>/dev/null || echo 0)"

          node -e '
            const [caseId, order, difficulty, variant, trial, exitCode, startMs, endMs,
                   toolCalls, mcInvocations, transcript, stderrLog, bytes] = process.argv.slice(1);
            process.stdout.write(JSON.stringify({
              case_id: caseId,
              order: Number(order),
              difficulty,
              variant,
              trial: Number(trial),
              exit_code: Number(exitCode),
              wall_clock_ms: Number(endMs) - Number(startMs),
              tool_calls: Number(toolCalls || 0),
              metadata_checker_invocations: Number(mcInvocations || 0),
              transcript_bytes: Number(bytes || 0),
              transcript_path: transcript,
              stderr_path: stderrLog,
            }) + "\n");
          ' "$CASE_ID" "$ORDER" "$DIFFICULTY" "$VARIANT" "$TRIAL" "$CASE_EXIT" \
            "$START_MS" "$END_MS" "$TOOL_CALLS" "$MC_INVOCATIONS" \
            "$TRANSCRIPT" "$STDERR_LOG" "$TRANSCRIPT_BYTES" >> "$RECORDS"

          echo "[$ORDER/$DIFFICULTY] $CASE_ID exit=$CASE_EXIT $(( (END_MS - START_MS) / 1000 ))s tool_calls=$TOOL_CALLS metadata_checker_invocations=$MC_INVOCATIONS"

          if [ "$CASE_EXIT" -ne 0 ]; then INFRA_FAILED=1; fi
          if [ ! -s "$TRANSCRIPT" ]; then
            echo "empty transcript for $CASE_ID"
            INFRA_FAILED=1
          fi
        done < "$QUESTIONS_TSV"

        # records.jsonl 是下游唯一输入（判分、grid、墙钟预算都读它），
        # 行数对不上说明循环中途被吞了，必须判红而不是让下游拿半份数据算比率。
        RECORD_COUNT="$(wc -l < "$RECORDS")"
        echo "SMOKE_RECORD_COUNT=${RECORD_COUNT}"
        test "$RECORD_COUNT" = "$(wc -l < "$QUESTIONS_TSV")"
        echo "SMOKE_TOTAL_WALL_CLOCK_MS=$(node -e '
          const fs = require("fs");
          const lines = fs.readFileSync(process.argv[1], "utf8").trim().split("\n");
          process.stdout.write(String(lines.reduce((a, l) => a + JSON.parse(l).wall_clock_ms, 0)));
        ' "$RECORDS")"

        # 语义 judge（软报告，不判红）：LLM 逐条判 must_mention / should_mention /
        # must_not_mention，替代原关键词命中统计——关键词对措辞变体太脆，判读必须基于
        # 语义。judge 复用 M58 的 CNB SSE adapter；infra 故障让测试失败，语义 pass/fail
        # 校准期只报告。judge.md 是判读答案质量的主入口，endStages 的原始 dump 只用于深查。
        # 判分外移（M58.2 阶段 B）落地前，这里保持原样并行跑，避免过渡期没有信号。
        export M58_CNB_REPO="${CNB_REPO_SLUG:?}"
        export M58_CNB_MODEL="${KIMI_JUDGE_MODEL:-deepseek-v4-flash}"
        export KIMI_SMOKE_TRANSCRIPT_DIR="$OUT_DIR"
        export KIMI_JUDGE_OUTPUT_DIR="$OUT_DIR"
        cargo test --features cli-local --test kimi_harness_judge_tests -- --ignored --nocapture
        test -s "$OUT_DIR/judge.json"
        cat "$OUT_DIR/judge.md"

        if grep -qF "$CNB_TOKEN" "$OUT_DIR"/smoke-transcript-*.jsonl "$OUT_DIR"/smoke-stderr-*.log 2>/dev/null; then
          echo "CNB_TOKEN leaked into kimi output"
          exit 1
        fi
        if [ "$INFRA_FAILED" -ne 0 ]; then
          echo "kimi infra failure; see per-case exit codes above and $RECORDS"
          exit 1
        fi
  endStages:
    - name: report smoke summary
      script: |
        # 同样按 POSIX sh 写。endStages 是复盘入口，不设 -e：这里每一步都带 || true，
        # 缺文件是常态（前面的 stage 可能在任意一步失败），不该再掩盖真正的失败原因。
        set -u
        OUT_DIR="target/kimi-harness-smoke"
        ls -lh "$OUT_DIR" || true
        # records.jsonl 是给下游读的；这里额外投影一份人读的表，
        # 免得复盘时先得自己解析 JSONL。
        if [ -s "$OUT_DIR/records.jsonl" ]; then
          echo "===== records ====="
          node -e '
            const fs = require("fs");
            const rows = fs.readFileSync(process.argv[1], "utf8").trim().split("\n").map(JSON.parse);
            for (const r of rows) {
              console.log([
                r.case_id, r.difficulty, "exit=" + r.exit_code,
                Math.round(r.wall_clock_ms / 1000) + "s",
                "tool_calls=" + r.tool_calls,
                "mc=" + r.metadata_checker_invocations,
                "bytes=" + r.transcript_bytes,
              ].join("  "));
            }
          ' "$OUT_DIR/records.jsonl" || true
        fi
        # 逐 case dump 含 tool_calls 的原始 JSONL 行（截断）与答案尾部，
        # 不假设 stream-json 的字段嵌套形态。CNB stage 日志有 ~115KB 上限、
        # 从头截断，全量 dump 会丢前面的问题，因此每段都压小。
        for TRANSCRIPT in "$OUT_DIR"/smoke-transcript-*.jsonl; do
          [ -e "$TRANSCRIPT" ] || continue
          CASE_ID="$(basename "$TRANSCRIPT" .jsonl)"
          CASE_ID="${CASE_ID#smoke-transcript-}"
          echo "===== ${CASE_ID} tool calls (raw, truncated) ====="
          grep '"tool_calls"' "$TRANSCRIPT" 2>/dev/null | cut -c1-600 || true
          echo "===== ${CASE_ID} transcript tail ====="
          tail -c 2000 "$TRANSCRIPT" 2>/dev/null || true
          echo "===== ${CASE_ID} stderr tail ====="
          tail -n 10 "$OUT_DIR/smoke-stderr-${CASE_ID}.log" 2>/dev/null || true
        done

# M58.2 issue 归档方案的前置探针：验证构建凭证 CNB_TOKEN 是否有 repo-issue:rw，
# 以及 pipeline 内 curl 建 issue、挂预建标签的行为。一次性非致命实验：任何失败只打印
# 不判红，产出的测试 issue 由本地善后关闭，不进任何 CI 阻塞层。
.issue_archive_probe_ci: &issue_archive_probe_ci
  name: issue-archive-probe
  runner:
    <<: *runner_amd64_2
  docker:
    <<: *browser_wasm_ci_image
  stages:
    - name: probe issue write permission
      script: |
        # 脱敏约定：token 只出现在 Authorization header，永不打印请求头。
        API="https://api.cnb.cool/${CNB_REPO_SLUG}/-/issues"
        CODE=$(curl -sS -o /tmp/probe-create.json -w "%{http_code}" -X POST "$API" \
          -H "Authorization: Bearer ${CNB_TOKEN}" \
          -H "Content-Type: application/json" \
          -d '{"title":"[test] pipeline token issue 写权限探针（验证后关闭）","body":"probe from pipeline","labels":["m58-smoke-record"]}' || echo "curl-error")
        echo "create-issue http=$CODE"
        head -c 800 /tmp/probe-create.json 2>/dev/null || true
        NUMBER=$(grep -o '"number": *[0-9"]*' /tmp/probe-create.json 2>/dev/null | head -n1 | tr -dc '0-9')
        echo "issue number=${NUMBER:-none}"
        if [ -n "$NUMBER" ]; then
          LCODE=$(curl -sS -o /tmp/probe-labels.json -w "%{http_code}" \
            -H "Authorization: Bearer ${CNB_TOKEN}" \
            "$API/$NUMBER/labels" || echo "curl-error")
          echo "list-labels http=$LCODE"
          head -c 800 /tmp/probe-labels.json 2>/dev/null || true
        fi

main:
  push: *main_authoritative_ci

"$":
  vscode:
    - *cloud_native_dev_env
  api_trigger_m58_llm:
    - *m58_cnb_llm_ci
  api_trigger_kimi_harness_smoke:
    - *kimi_harness_smoke_ci
  api_trigger_issue_archive_probe:
    - *issue_archive_probe_ci

"**":
  push:
    - *rust_ci_branch_push
  pull_request: *pr_fast_ci
