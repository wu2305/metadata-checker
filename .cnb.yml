# kimi-code CLI 安装步骤在 cloud-native-dev-env 与 kimi-code-harness-smoke 中各内联一份
#（CNB schema 要求顶层锚点必须是 array/object，无法给裸脚本字符串做锚点复用）。
# install.sh 把二进制装到 ~/.kimi-code/bin（PATH 写进 ~/.bashrc，但 CI stage 不 source 它）；
# 软链进 /usr/local/bin 保证后续 stage 与远程 SSH 会话不依赖 PATH 也能直接命中 kimi。

.cloud_native_dev_env: &cloud_native_dev_env
  name: cloud-native-dev-env
  runner:
    tags: cnb:arch:amd64
  docker:
    <<: *browser_wasm_ci_image
    volumes:
      - /usr/local/cargo/registry
      - /usr/local/cargo/git
      - ./target/cnb/workspace
  services:
    # 默认 10 分钟检测不到 http/ssh 心跳就关环境；远程 SSH 里两次操作之间
    # 很容易超过 10 分钟，放宽到 1 小时避免会话被回收。
    - name: vscode
      options:
        keepAliveTimeout: 1h
    - docker
  # 真实项目语料的部署 token。dev 环境自身注入的 CNB_TOKEN 虽然是用户态身份
  # （API /user 返回 wu2305），但授权范围只到本仓：实测 GET
  # /wu2305/succbi_project_container 返回 403、GET /wu2305/metadata-checker 返回 200，
  # 因此 dev 环境里直接 clone 语料会失败。流水线侧的 CNB_TOKEN 有跨仓授权，
  # dev 环境没有，差别不在 imports 而在 token 本身。
  #
  # 这行 imports 曾经打不开：real-fixture.yml 自身声明了 allow_events，vscode 不在
  # 其中，加上会让 Prepare 阶段直接失败、整个开发环境起不来（实测 sn=cnb-ao8-1k1ns62sh）：
  #   Pipeline init error: event: vscode does not conform to allow_events of
  #   https://cnb.cool/wu2305/metadata-checker-keys/-/blob/main/real-fixture.yml
  # 2026-09-05 仓库所有者已在 metadata-checker-keys 的 real-fixture.yml 里把 vscode
  # 加进 allow_events，故此处放开。代价是该部署 token 会注入到可交互 SSH 的开发环境，
  # 而不只是短生命周期流水线——这是明确的取舍决定，不是疏漏。
  imports:
    - https://cnb.cool/wu2305/metadata-checker-keys/-/blob/main/real-fixture.yml
  env:
    CARGO_TARGET_DIR: target/cnb/workspace
  stages:
    - name: toolchain
      script: |
        node --version
        rustc --version
        cargo --version
        wasm-bindgen --version
        bencher --version
    # Remote-SSH 的前置条件在镜像里（.cnb/images/browser-wasm-ci.Dockerfile 预装
    # openssh-server）。这里只做断言：缺了就在开环境时立刻失败，
    # 而不是等到 VSCode/Cursor 连不上才发现。
    - name: remote ssh preflight
      script: |
        test -x /usr/sbin/sshd || command -v sshd
        test -d /run/sshd
    - name: fetch dependencies
      script: cargo fetch
    - name: install kimi-code
      script: |
        curl -fsSL https://code.kimi.com/kimi-code/install.sh | bash
        export PATH="$HOME/.local/bin:$PATH"
        KIMI_BIN="$(command -v kimi || true)"
        for KCAND in "$HOME/.kimi-code/bin/kimi" "$HOME/.local/bin/kimi"; do
          if [ -z "$KIMI_BIN" ] && [ -x "$KCAND" ]; then KIMI_BIN="$KCAND"; fi
        done
        test -n "$KIMI_BIN"
        ln -sf "$KIMI_BIN" /usr/local/bin/kimi
        kimi --version
    - name: configure kimi-code cnb-ai-chat provider
      script: |
        # 目标：开发环境创建完成后，用户打开终端即可 `kimi`，默认模型走 CNB AI Chat。
        # endpoint 契约：POST https://api.cnb.cool/{repo}/-/ai/chat/completions，
        # 仅支持 stream=true，认证用构建凭证 CNB_TOKEN。
        # kimi-code 不从 shell 环境读凭证，api_key 必须落在 config.toml；
        # vscode 事件若未注入 CNB_TOKEN，则写入占位符并打印手工配置指引，不让开环境失败。
        mkdir -p "$HOME/.kimi-code"
        KC_BASE_URL="https://api.cnb.cool/${CNB_REPO_SLUG:-OWNER/REPO}/-/ai"
        KC_API_KEY="${CNB_TOKEN:-__PUT_CNB_TOKEN_HERE__}"
        {
          echo '# 由 .cnb.yml cloud-native-dev-env configure 阶段生成，可手工修改'
          echo 'default_model = "cnb-ai-chat/deepseek-v4-flash"'
          echo ''
          echo '[providers.cnb-ai-chat]'
          echo 'type = "openai"'
          echo "base_url = \"${KC_BASE_URL}\""
          echo "api_key = \"${KC_API_KEY}\""
          echo ''
          echo '[models."cnb-ai-chat/deepseek-v4-flash"]'
          echo 'provider = "cnb-ai-chat"'
          echo 'model = "deepseek-v4-flash"'
          echo '# max_context_size 是保守估计值，按网关实际窗口调整'
          echo 'max_context_size = 131072'
          echo 'capabilities = ["tool_use"]'
        } > "$HOME/.kimi-code/config.toml"
        chmod 600 "$HOME/.kimi-code/config.toml"
        # metadata-checker 使用协议挂到用户级 skill 目录，环境内任意 kimi 会话可发现。
        mkdir -p "$HOME/.agents/skills/metadata-checker"
        cp SKILL.md "$HOME/.agents/skills/metadata-checker/SKILL.md"
        if [ "$KC_API_KEY" = "__PUT_CNB_TOKEN_HERE__" ]; then
          echo "[kimi-code] 当前事件未注入 CNB_TOKEN，config.toml 已写入占位符。"
          echo "[kimi-code] 使用前把 ~/.kimi-code/config.toml 的 api_key 换成有效 token，"
          echo "[kimi-code] 或用 KIMI_MODEL_NAME/KIMI_MODEL_API_KEY/KIMI_MODEL_BASE_URL 临时注入。"
        else
          kimi doctor config
          echo "[kimi-code] provider=cnb-ai-chat default_model=cnb-ai-chat/deepseek-v4-flash 配置完成"
        fi
    - name: fetch real project corpus
      script: |
        set -eu

        # 把真实项目语料 sparse 拉进 dev 环境，供 M59 后端迁移的真实语料实测使用。
        # 仓库、提交 pin 与语料路径均由 real-fixture.yml 提供；不要在这里假定旧版
        # xiaoshouyi-corpus 分支或 projects/xiaoshouyi 目录结构。
        #
        # 失败不阻塞开环境：没有 token、网络不通或语料仓不可达时打印指引后跳过，
        # 与上面 kimi-code 占位符同策略——开发环境的主职责是编译排错，不是跑语料。
        #
        # 凭证只走 http.extraHeader 请求头，不落盘、不进 remote URL，末尾断言
        # 它没有被 git 持久化进 .git/config。不要 echo 展开值。
        REAL_DIR="target/real-project/succbi_project_container"
        CORPUS_PATH="${REAL_PROJECT_FIXTURE_PROJECT_PATH:-xiaoshouyi}"
        CORPUS_DIR="$REAL_DIR/$CORPUS_PATH"
        CORPUS_SLUG="${REAL_PROJECT_FIXTURE_REPO_SLUG:-wu2305/succbi_project_container}"
        CORPUS_URL="${REAL_PROJECT_FIXTURE_REPO_URL:-https://cnb.cool/${CORPUS_SLUG}.git}"
        # Git 输出的 object ID 为小写；先规范化，避免合法的大写十六进制 pin
        # 在后续精确比较时被误判。
        CORPUS_REF="$(printf '%s' "${REAL_PROJECT_FIXTURE_REF:-}" | tr 'A-F' 'a-f')"
        CORPUS_BRANCH="${REAL_PROJECT_FIXTURE_BRANCH:-main}"

        corpus_path_is_safe() {
          # sparse-checkout 与 Git pathspec 只接受仓库内的普通相对目录；限制字符集
          # 同时拒绝空段、`.`/`..` 段和 pathspec magic。
          printf '%s\n' "$CORPUS_PATH" | grep -Eq '^[A-Za-z0-9_-]+([.][A-Za-z0-9_-]+)*(/[A-Za-z0-9_-]+([.][A-Za-z0-9_-]+)*)*$'
        }

        corpus_config_has_credentials() {
          [ -f "$REAL_DIR/.git/config" ] || return 1
          # 拒绝任何持久化的鉴权 header 或带 userinfo 的 remote URL；即使本次
          # imports 没有注入 token，也不能继续复用历史 workspace 中的不安全缓存。
          if corpus_config_scope_has_credentials --local; then
            return 0
          fi
          WORKTREE_CONFIG="$(git -C "$REAL_DIR" config --local --includes --bool \
            --get extensions.worktreeConfig 2>/dev/null || true)"
          if [ "$WORKTREE_CONFIG" = true ] \
              && corpus_config_scope_has_credentials --worktree; then
            return 0
          fi
          return 1
        }

        corpus_config_scope_has_credentials() {
          CONFIG_SCOPE="$1"
          # --includes 同时覆盖 local config 引用的外部文件；启用
          # extensions.worktreeConfig 时再检查 config.worktree。
          if git -C "$REAL_DIR" config "$CONFIG_SCOPE" --includes --list --name-only 2>/dev/null \
              | grep -Eiq '(^|[.])extraheader$'; then
            return 0
          fi
          if git -C "$REAL_DIR" config "$CONFIG_SCOPE" --includes \
              --get-regexp '^remote\..*\.(url|pushurl)$' 2>/dev/null \
              | grep -Eq '://[^/@[:space:]]+@'; then
            return 0
          fi
          if [ -n "${REAL_PROJECT_FIXTURE_DEPLOY_TOKEN:-}" ] \
              && git -C "$REAL_DIR" config "$CONFIG_SCOPE" --includes --list 2>/dev/null \
                | grep -qF -- "$REAL_PROJECT_FIXTURE_DEPLOY_TOKEN"; then
            return 0
          fi
          return 1
        }

        remove_corpus_dir() {
          if rm -rf -- "$REAL_DIR"; then
            return 0
          fi
          echo "[corpus] cleanup failed: ${REAL_DIR}" >&2
          return 1
        }

        corpus_checkout_ready() {
          CORPUS_CHECKOUT_REASON=unknown
          [ -d "$REAL_DIR/.git" ] || { CORPUS_CHECKOUT_REASON=missing_repo; return 1; }
          [ -d "$CORPUS_DIR" ] || { CORPUS_CHECKOUT_REASON=missing_project_path; return 1; }
          ! corpus_config_has_credentials || { CORPUS_CHECKOUT_REASON=persisted_credentials; return 1; }
          CHECKED_OUT_SHA="$(git -C "$REAL_DIR" rev-parse HEAD)" \
            || { CORPUS_CHECKOUT_REASON=unreadable_head; return 1; }
          [ "$CHECKED_OUT_SHA" = "$CORPUS_REF" ] \
            || { CORPUS_CHECKOUT_REASON=ref_mismatch; return 1; }
          CACHED_ORIGIN="$(git -C "$REAL_DIR" config --local --includes --get-all remote.origin.url)" \
            || { CORPUS_CHECKOUT_REASON=missing_origin; return 1; }
          [ "$CACHED_ORIGIN" = "$CORPUS_URL" ] \
            || { CORPUS_CHECKOUT_REASON=origin_mismatch; return 1; }
          WORKTREE_CONFIG="$(git -C "$REAL_DIR" config --local --includes --bool \
            --get extensions.worktreeConfig 2>/dev/null || true)"
          if [ "$WORKTREE_CONFIG" = true ]; then
            WORKTREE_ORIGIN="$(git -C "$REAL_DIR" config --worktree --includes \
              --get-all remote.origin.url 2>/dev/null || true)"
            [ -z "$WORKTREE_ORIGIN" ] \
              || { CORPUS_CHECKOUT_REASON=worktree_origin_override; return 1; }
          fi
          WORKTREE_STATUS="$(git -C "$REAL_DIR" status --porcelain --untracked-files=all --ignored=matching)" \
            || { CORPUS_CHECKOUT_REASON=unreadable_worktree; return 1; }
          [ -z "$WORKTREE_STATUS" ] || { CORPUS_CHECKOUT_REASON=dirty_worktree; return 1; }

          # 工作树文件数必须与 pinned commit 中的普通 blob 数一致；这样 ignored
          # 文件、symlink、目录伪装或不属于该提交的路径都不能触发 READY。
          SPG_COUNT="$(find "$CORPUS_DIR" -type f -name '*.spg' | wc -l)" \
            || { CORPUS_CHECKOUT_REASON=unreadable_spg_files; return 1; }
          TBL_COUNT="$(find "$CORPUS_DIR" -type f -name '*.tbl' | wc -l)" \
            || { CORPUS_CHECKOUT_REASON=unreadable_tbl_files; return 1; }
          # 中文文件名默认会被 Git quote 成带结尾引号的转义文本；关闭 quote 后再
          # 判断扩展名，避免把真实 tracked metadata 漏计为 0。
          TRACKED_SPG_COUNT="$(git -C "$REAL_DIR" -c core.quotePath=false \
            ls-tree -r "$CORPUS_REF" -- "$CORPUS_PATH" \
            | awk '$1 ~ /^100(644|755)$/ && $2 == "blob" && $0 ~ /[.]spg$/ { count++ } END { print count + 0 }')" \
            || { CORPUS_CHECKOUT_REASON=unreadable_tracked_spg; return 1; }
          TRACKED_TBL_COUNT="$(git -C "$REAL_DIR" -c core.quotePath=false \
            ls-tree -r "$CORPUS_REF" -- "$CORPUS_PATH" \
            | awk '$1 ~ /^100(644|755)$/ && $2 == "blob" && $0 ~ /[.]tbl$/ { count++ } END { print count + 0 }')" \
            || { CORPUS_CHECKOUT_REASON=unreadable_tracked_tbl; return 1; }
          [ "$SPG_COUNT" -gt 0 ] || { CORPUS_CHECKOUT_REASON=empty_spg; return 1; }
          [ "$TBL_COUNT" -gt 0 ] || { CORPUS_CHECKOUT_REASON=empty_tbl; return 1; }
          [ "$SPG_COUNT" -eq "$TRACKED_SPG_COUNT" ] \
            || { CORPUS_CHECKOUT_REASON=spg_tree_mismatch; return 1; }
          [ "$TBL_COUNT" -eq "$TRACKED_TBL_COUNT" ] \
            || { CORPUS_CHECKOUT_REASON=tbl_tree_mismatch; return 1; }
          CORPUS_CHECKOUT_REASON=ready
        }

        if ! printf '%s\n' "$CORPUS_REF" | grep -Eq '^[0-9a-fA-F]{40}$'; then
          echo "[corpus] CORPUS_UNAVAILABLE：REAL_PROJECT_FIXTURE_REF 必须是 40 位提交 SHA；开发环境继续启动。"
        elif ! corpus_path_is_safe; then
          echo "[corpus] CORPUS_UNAVAILABLE：fixture path 必须是仓库内的安全相对目录；开发环境继续启动。"
        elif printf '%s\n' "$CORPUS_URL" | grep -Eq '://[^/@[:space:]]+@'; then
          echo "[corpus] CORPUS_UNAVAILABLE：fixture URL 不得内嵌凭据；开发环境继续启动。"
        elif [ -d "$REAL_DIR/.git" ] && corpus_config_has_credentials; then
          echo "[corpus] CORPUS_UNAVAILABLE：缓存仓库持久化了凭据，已删除且本轮不复用；开发环境继续启动。"
          remove_corpus_dir || true
        elif corpus_checkout_ready; then
          echo "[corpus] READY cached=true spg=${SPG_COUNT} tbl=${TBL_COUNT} sha=${CHECKED_OUT_SHA} path=${CORPUS_PATH}"
        elif [ -z "${REAL_PROJECT_FIXTURE_DEPLOY_TOKEN:-}" ]; then
          echo "[corpus] CORPUS_UNAVAILABLE：未注入 REAL_PROJECT_FIXTURE_DEPLOY_TOKEN，跳过语料拉取。"
          echo "[corpus] dev 环境自身的 CNB_TOKEN 只有本仓授权（实测语料仓 403），"
          echo "[corpus] 需要 imports 里的 real-fixture.yml 生效才能拉取。"
        else
          AUTH_HEADER="Authorization: Basic $(printf '%s:%s' cnb "$REAL_PROJECT_FIXTURE_DEPLOY_TOKEN" | base64 -w0)"

          fetch_real_corpus() {
            remove_corpus_dir || return 1
            # 先按分支取得浅克隆，再按 imports 给出的 ref（通常是不可变 SHA）校验或
            # fetch。`git clone --branch` 不能接受任意提交 SHA。
            if ! git -c http.extraHeader="$AUTH_HEADER" clone --depth 1 \
                --filter=blob:none --sparse --branch "$CORPUS_BRANCH" \
                "$CORPUS_URL" "$REAL_DIR" 2>&1; then
              echo "[corpus] partial clone 失败，去掉 blob filter 重试"
              remove_corpus_dir || return 1
              git -c http.extraHeader="$AUTH_HEADER" clone --depth 1 --sparse \
                --branch "$CORPUS_BRANCH" "$CORPUS_URL" "$REAL_DIR" 2>&1 || return 1
            fi

            CURRENT_SHA="$(git -C "$REAL_DIR" rev-parse HEAD)" || return 1
            EXPECTED_SHA="$CORPUS_REF"
            if [ "$CURRENT_SHA" != "$CORPUS_REF" ]; then
              git -C "$REAL_DIR" -c http.extraHeader="$AUTH_HEADER" \
                fetch --depth 1 origin "$CORPUS_REF" || return 1
              FETCHED_SHA="$(git -C "$REAL_DIR" rev-parse FETCH_HEAD)" || return 1
              [ "$FETCHED_SHA" = "$EXPECTED_SHA" ] || return 1
              git -C "$REAL_DIR" -c http.extraHeader="$AUTH_HEADER" \
                checkout --detach "$EXPECTED_SHA" || return 1
            fi

            # partial clone 可能在 checkout 时按需拉 blob，仍须显式携带临时鉴权头。
            git -C "$REAL_DIR" -c http.extraHeader="$AUTH_HEADER" \
              sparse-checkout set "$CORPUS_PATH" || return 1
            [ -d "$CORPUS_DIR" ] || return 1

            if ! corpus_checkout_ready; then
              echo "[corpus] checkout validation failed: ${CORPUS_CHECKOUT_REASON}" >&2
              return 1
            fi

            echo "[corpus] READY spg=${SPG_COUNT} tbl=${TBL_COUNT} sha=${CHECKED_OUT_SHA} path=${CORPUS_PATH}"
            du -sh "$CORPUS_DIR" 2>/dev/null || true
          }

          if ! fetch_real_corpus; then
            echo "[corpus] CORPUS_UNAVAILABLE：clone、ref、路径或非空校验失败；开发环境继续启动。"
            remove_corpus_dir || true
          fi
        fi

# ponytail: stage 级 if 跳过 main，避免与 main.push 重复跑 rust-ci
.rust_ci_branch_push: &rust_ci_branch_push
  name: rust-ci-branch-push
  runner:
    <<: *runner_amd64_2
  docker:
    <<: *browser_wasm_ci_image
    volumes:
      - /usr/local/cargo/registry
      - /usr/local/cargo/git
      # 同 `.rust_ci`：只挂 coverage 目标目录，不挂整个 ./target。
      - ./target/cnb/coverage
  env:
    CARGO_TARGET_DIR: target/cnb/coverage
  stages:
    # 同 main 分支：AI 评测执行测试不再被排除，
    # 缺真实项目语料现在是测试内的显式跳过，而不是整条测试消失。
    - name: rust ci
      if: '[ "$CNB_BRANCH" != "main" ]'
      script: |
        # 与 `.rust_ci` 共用 scripts/cnb-probe-cargo-target.sh：
        # 曾观察到 cargo 创建临时文件时报 EACCES（exit 101），原因需结合现场核验。
        # 探测失败直接退出，保留缓存与权限并输出现场。
        # 必须 `|| exit 1`：CNB stage 脚本默认不开 errexit，不加这层保护的话
        # 探测失败也会被后面的命令覆盖退出码，静默跑成绿的。
        sh scripts/cnb-probe-cargo-target.sh || exit 1
        rustc --version
        cargo --version
        cargo llvm-cov --version
        cargo fmt --check
        cargo check --benches
        rm -rf target/debug
        mkdir -p target target/cnb/coverage/llvm-cov-target
        ln -sfn cnb/coverage/llvm-cov-target/debug target/debug
        cargo llvm-cov test \
          --workspace \
          --lcov \
          --output-path lcov.info \
          -- \
          --test-threads=1
        test -s lcov.info
        cargo check --no-default-features --features browser-wasm --target wasm32-unknown-unknown

.pr_fast_ci: &pr_fast_ci
  - *rust_ci
  - *browser_offscreen_bench_ci

# 知识库（CNB knowledge:update）。
#
# 白名单而非全量：docs/ 下 253 个跟踪文件中 archive 46 个、ai-eval-runs 115 个
# （含评测答案键）。默认 `include: "**/**.md"` 加默认开启的 Issue 同步，会把已归档
# 结论与当前事实混在一起召回，向量检索分不出新旧。因此只索引人工撰写、带源码依据
# 的 docs/knowledge/** 与两个 Agent 入口文件。
#
# 不索引源码：knowledge:update 当前支持 .md/.mdx/.docx/.txt/.pdf，不支持 .rs；
# 源码知识以「附 src/xxx.rs:NNN + 分析 SHA 的主题文档」形式入库。
# 处理失败报错（ignoreProcessFailures: false），不让「入库成功」掩盖部分文档失败。
# 不无条件 forceRebuild：白名单结构变更或确认索引陈旧时，固定 SHA 手动重建一次。
# ifModify 让无关提交不额外占一条并发（知识库任务不需要编译环境，不挂 docker/volumes）。
.knowledge_base_ci: &knowledge_base_ci
  name: knowledge-base
  ifModify:
    - docs/knowledge/**
    - AGENTS.md
    - SKILL.md
    - .cnb.yml
  # 说明：docs/knowledge-acceptance/** 不在 ifModify 里——它不入库，改它不必重建索引。
  stages:
    - name: update knowledge base
      type: knowledge:update
      options:
        include:
          - "docs/knowledge/**/*.md"
          - "AGENTS.md"
          - "SKILL.md"
        # include 已是显式白名单，与这三条无交集；保留它们作为放宽 include 时的兜底。
        exclude:
          - "docs/ai-eval-runs/**"        # 评测答案键，任何口径都不得入库
          - "docs/archive/**"             # 已归档历史结论，与当前事实词面几乎一样
          - "docs/knowledge-acceptance/**" # 验收问题集与答案键：入库即用答案验答案
        chunkSize: 1200
        chunkOverlap: 150
        issueSyncEnabled: false
        ignoreProcessFailures: false
        forceRebuild: false

# 自动把 CNB 全量镜像到 GitHub（main.push 触发）。
# GitHub 凭据经密钥仓库 imports 注入；密钥未配置时脚本优雅跳过，不判红。
.github_mirror_push_ci: &github_mirror_push_ci
  name: github-mirror-push
  runner:
    <<: *runner_amd64_2
  docker:
    <<: *browser_wasm_ci_image
  imports:
    - https://cnb.cool/wu2305/metadata-checker-keys/-/blob/main/github-mirror.yml
  stages:
    - name: mirror to github (full)
      script: bash scripts/sync-to-github.sh

# GitHub 侧 push（含 merge）经 .github/workflows/cnb-sync.yml 调用
# api_trigger_github_sync_from 自动触发；也可由 web_trigger 按钮手动触发。
# 把 GitHub 全量同步回 CNB，分支隔离到 github-sync/* 命名空间。
# 公开仓库匿名 fetch 即可，无需凭据；GitHub 仓库转私有时再恢复下方 imports
# 并在密钥仓库创建 github-mirror.yml（GITHUB_MIRROR_TOKEN 需 repo 读权限）。
.github_sync_from_ci: &github_sync_from_ci
  name: github-sync-from
  runner:
    <<: *runner_amd64_2
  docker:
    <<: *browser_wasm_ci_image
  # imports:
  #   - https://cnb.cool/wu2305/metadata-checker-keys/-/blob/main/github-mirror.yml
  stages:
    - name: sync from github (quarantined namespace)
      script: bash scripts/sync-from-github.sh

.main_authoritative_ci: &main_authoritative_ci
  - *rust_ci
  - *browser_offscreen_bench_ci_with_bencher
  - *fixture_bench_ci
  - *full_criterion_query_ci
  - *full_criterion_rebuild_ci
  - *full_criterion_rebuild_crud_ci
  - *full_criterion_redb_ci
  - *full_criterion_boundary_ci
