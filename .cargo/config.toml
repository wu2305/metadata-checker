[target.x86_64-unknown-linux-musl]
linker = "zig"
rustflags = ["-C", "link-arg=-target", "-C", "link-arg=x86_64-linux-musl"]

[target.aarch64-unknown-linux-musl]
linker = "zig"
rustflags = ["-C", "link-arg=-target", "-C", "link-arg=aarch64-linux-musl"]

[target.x86_64-pc-windows-gnu]
linker = "zig"
rustflags = ["-C", "link-arg=-target", "-C", "link-arg=x86_64-windows-gnu"]
