<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Metadata Checker</title>
    <style>
      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        margin: 0;
        min-width: 280px;
        padding: 12px;
      }
      dl {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 6px 10px;
        margin: 0 0 12px;
      }
      dt {
        color: #5f6368;
      }
      dd {
        margin: 0;
        overflow-wrap: anywhere;
      }
      button {
        margin: 0 0 6px;
        width: 100%;
      }
      pre {
        background: #f5f5f5;
        max-height: 180px;
        overflow: auto;
        padding: 8px;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <dl>
      <dt>Bridge</dt>
      <dd data-field="bridge">unknown</dd>
      <dt>Source</dt>
      <dd data-field="source">unknown</dd>
      <dt>Selection</dt>
      <dd data-field="selection">unknown</dd>
      <dt>Indexing</dt>
      <dd data-field="indexing">unknown</dd>
      <dt>Progress</dt>
      <dd data-field="progress">unknown</dd>
      <dt>Current</dt>
      <dd data-field="current">unknown</dd>
      <dt>Cache</dt>
      <dd data-field="cache">unknown</dd>
    </dl>
    <button type="button" data-action="open-panel">Open panel</button>
    <button type="button" data-action="hide-panel">Hide panel</button>
    <button type="button" data-action="refresh-bridge">Refresh bridge</button>
    <button type="button" data-action="process-background">Process background</button>
    <button type="button" data-action="retry-current-selection">Retry current selection</button>
    <button type="button" data-action="analyze">Analyze current selection</button>
    <pre data-field="diagnostic"></pre>
    <script src="popup.js"></script>
  </body>
</html>
