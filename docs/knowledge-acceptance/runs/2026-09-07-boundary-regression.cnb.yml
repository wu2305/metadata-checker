$:
  api_trigger_knowledge_acceptance:
    - name: knowledge-acceptance
      docker:
        image: python:3.12-slim
      stages:
        - name: update knowledge base
          type: knowledge:update
          options:
            include:
              - docs/knowledge/**/*.md
              - AGENTS.md
              - SKILL.md
            exclude:
              - docs/ai-eval-runs/**
              - docs/archive/**
              - docs/knowledge-acceptance/**
            chunkSize: 1200
            chunkOverlap: 150
            issueSyncEnabled: false
            ignoreProcessFailures: false
            forceRebuild: true
        - name: script regressions
          script: python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v
        - name: capture fresh-context answers
          script: |
            set -eu
            python3 -c 'import json; from pathlib import Path; root=Path("docs/knowledge-acceptance"); questions=json.loads((root/"questions.json").read_text())+json.loads((root/"questions-boundaries.json").read_text()); Path("/tmp/kb-questions.json").write_text(json.dumps(questions,ensure_ascii=False,indent=2)+"\n")'
            python3 scripts/kb-evaluate.py \
              --questions /tmp/kb-questions.json \
              --indexed-sha "$CNB_COMMIT" \
              --output target/knowledge-acceptance/run.json.gz
      endStages:
        - name: archive acceptance evidence
          script: |
            test -s target/knowledge-acceptance/run.json.gz || exit 1
            echo KB_EVIDENCE_BEGIN
            base64 target/knowledge-acceptance/run.json.gz
            echo KB_EVIDENCE_END
